<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Saiver Pharmacy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/extra.css">
</head>
<body class="login-body" data-page="login">
  <main class="login-wrap">
    <section class="login-card">
      <img class="login-logo" id="loginLogo" alt="OU Pharmacy">
      <h1>Welcome back</h1>
      <p class="login-sub">Sign in to Saiver Pharmacy operations.</p>
      <div class="login-error" id="loginError" hidden></div>
      <form id="loginForm" class="login-form" novalidate>
        <label class="field"><span>Username</span>
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field"><span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button button-primary login-btn" type="submit" id="loginBtn">Sign in</button>
      </form>
    </section>
  </main>

  <script src="js/logo-data.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function () {
      var logo = document.getElementById("loginLogo");
      if (window.LOGO_FULL) logo.src = window.LOGO_FULL;

      var form = document.getElementById("loginForm");
      var btn = document.getElementById("loginBtn");
      var errorBox = document.getElementById("loginError");

      function showError(text) {
        errorBox.textContent = text;
        errorBox.hidden = false;
      }

      // Already signed in? Go straight to the dashboard.
      if (Api.getToken()) {
        Api.me().then(function () {
          location.replace("dashboard.html");
        }).catch(function () {
          Api.clearToken();
        });
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errorBox.hidden = true;

        var username = form.elements.username.value.trim();
        var password = form.elements.password.value;
        if (!username || !password) {
          showError("Enter your username and password.");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Signing in…";
        try {
          await Api.login(username, password);
          location.href = "dashboard.html";
        } catch (err) {
          showError(err.message);
          btn.disabled = false;
          btn.textContent = "Sign in";
        }
      });
    })();
  </script>
</body>
</html>
